<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Lilim — Real-time Music Visuals</title>
    <meta
      name="description"
      content="Lilim is a browser-based AI VJ agent. Point it at your music and it directs generative visuals, scene changes, and camera cuts in real time — no manual VJing, no presets to babysit."
    />

    <!-- Favicon: drop favicon.ico into /public — this tag just makes the
         reference explicit rather than relying on the browser's implicit
         /favicon.ico lookup. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Open Graph / Twitter. og:image points at the real console capture in
         public/proof/ (see Home.tsx's proof section) — unprocessed for now,
         same as that section; swap the file later and this keeps working. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lilim — Real-time Music Visuals" />
    <meta
      property="og:description"
      content="A browser-based AI VJ agent. Point it at your music — Lilim directs generative visuals, scene changes, and camera cuts in real time."
    />
    <meta property="og:image" content="/proof/console.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lilim — Real-time Music Visuals" />
    <meta
      name="twitter:description"
      content="A browser-based AI VJ agent. Point it at your music — Lilim directs generative visuals, scene changes, and camera cuts in real time."
    />
    <meta name="twitter:image" content="/proof/console.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
